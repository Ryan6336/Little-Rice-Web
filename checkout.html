<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="payment.css">
	<title>Checkout Area</title>
</head>

<body id="checkout-page">
  <div class="container"> 
  <header class="top">
       </div>

        <section class="main-form ">
            <h3>Checkout</h3>
            <p class="small-note">Select payment method for checkout</p>

            <form id="payForm" action="#" method="post">
                <div class="pay-sec">
                    <label class="rb-label">
                        <input type="radio" name="payType" value="cash" checked onchange="switchBox()">
                        <span class="rb-custom"></span>
                        Pay in cash
                    </label>

                    <label class="rb-label">
                        <input type="radio" name="payType" value="bank" onchange="switchBox()">
                        <span class="rb-custom"></span>
                        Bank Transfer
                    </label>
                </div>

                <button type="submit" class="submit-btn">Confirm</button>

            </form>
        </section>
      </div>
	
<footer class="site-footer">
  <div class="footer-content">
    <span class="footer-title">CONTACT US</span>

    <div class="footer-icons">
      <a href="https://www.instagram.com/littlericehouse/"
         target="_blank" rel="noopener noreferrer"
         aria-label="Instagram">
        <img src="img/instagram.png" alt="Instagram">
      </a>

      <a href="https://wa.me/6738872299"
         target="_blank" rel="noopener noreferrer"
         aria-label="WhatsApp">
        <img src="img/Digital_Glyph_Green_RGB_2026.png" alt="Digital_Glyph_Green_RGB_2026">
      </a>

      <a href="tel:+6738872299" aria-label="Call us">
        <img src="img/telephone.png" alt="telephone">
      </a>
      
        </div>
    </div>
</footer>

<script src="pay.js"></script>
</body>
</html>
